<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Front End</title>
    <script src="scripts/script.js"></script>
    <script defer src="scripts/login.js"></script>
</head>
<body>
    <nav>
        <a href="/index.html">All Songs</a>
        <a href="/add_song.html">Add Songs</a>
        <button id="logout" style="float: right;">Logout</button>
    </nav>

    <h1>Login Page</h1>
    <form id="login">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button id="loginBtn" type="button">Login</button>
        <p id="errorMsg"></p>
    </form>
    <p>Not Registered? <a href="/registration.html">click here</a></p>

    <button id="statusBtn">Display Status</button>
    
</body>
</html>
